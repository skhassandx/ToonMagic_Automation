name: ToonMagic Auto Cartoon Generator & Uploader

on:
  schedule:
    # Runs automatically every day at 10:00 AM UTC (4:00 PM BST)
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ToonMagic Automation Script
        env:
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
          DEAPI_API_TOKEN: ${{ secrets.DEAPI_API_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python main.py

      - name: Commit & Push Generated Backups to Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "ToonMagic-Bot"
          git config --global user.email "bot@toonmagic.internal"
          git add backup/
          git commit -m "Auto Backup: New Story, Scenes & Videos [skip ci]" || echo "No changes to commit"
          git push
